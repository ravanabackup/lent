<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Deep-Dive Lent Algorithm</title>
    <style>
        :root { --glow: #00ff41; --dim: #003b00; --bg: #050505; }
        body { font-family: 'Courier New', monospace; background: var(--bg); color: var(--glow); padding: 20px; }
        .terminal { max-width: 900px; margin: 0 auto; border: 1px solid var(--dim); padding: 20px; background: #000; box-shadow: 0 0 20px var(--dim); }
        .header { text-align: center; border-bottom: 1px solid var(--dim); margin-bottom: 20px; padding-bottom: 10px; }
        .input-area { margin-bottom: 30px; display: flex; align-items: center; gap: 10px; }
        input { background: #000; border: 1px solid var(--glow); color: var(--glow); padding: 5px; width: 80px; font-size: 1.1rem; }
        button { background: var(--glow); color: #000; border: none; padding: 5px 15px; font-weight: bold; cursor: pointer; }
        .step-block { margin-bottom: 25px; border-left: 2px solid var(--dim); padding-left: 15px; }
        .step-header { font-weight: bold; color: #fff; text-transform: uppercase; margin-bottom: 5px; }
        .explanation { color: #888; font-size: 0.9rem; font-style: italic; margin-bottom: 8px; max-width: 700px; }
        .math-line { color: #00ff41; }
        .highlight { color: #ffd700; }
        .final-result { border: 2px solid var(--glow); padding: 20px; margin-top: 30px; text-align: center; font-size: 1.4rem; background: #001100; }
    </style>
</head>
<body>

<div class="terminal">
    <div class="header">
        <h1>[ LENT_OS: ALGORITHM_EXPANSION_MODE ]</h1>
    </div>

    <div class="input-area">
        <span>TARGET_YEAR_QUERY > </span>
        <input type="number" id="yearVal" value="2026">
        <button onclick="runDeepCalc()">EXECUTE_EXPANSION</button>
    </div>

    <div id="output"></div>
</div>

<script>
    async function printStep(stepData) {
        const out = document.getElementById('output');
        const block = document.createElement('div');
        block.className = 'step-block';
        
        block.innerHTML = `
            <div class="step-header">${stepData.title}</div>
            <div class="explanation">${stepData.why}</div>
            <div class="math-line">${stepData.math}</div>
        `;
        
        out.appendChild(block);
        window.scrollTo(0, document.body.scrollHeight);
        await new Promise(r => setTimeout(r, 800));
    }

    async function runDeepCalc() {
        const Y = parseInt(document.getElementById('yearVal').value);
        document.getElementById('output').innerHTML = "";
        
        // Step 1
        const a = Y % 19;
        await printStep({
            title: "Step 1: The Metonic Cycle (a)",
            why: "The moon's phases repeat on the same calendar days every 19 years. This calculation finds where the year fits in that cycle.",
            math: `a = ${Y} % 19 = <span class="highlight">${a}</span>`
        });

        // Step 2
        const b = Math.floor(Y / 100);
        const c = Y % 100;
        const d = Math.floor(b / 4);
        const e = b % 4;
        await printStep({
            title: "Step 2: Century & Solar Correction (b, c, d, e)",
            why: "The solar year isn't exactly 365.25 days. These variables track century leap-year shifts to keep the equinox on March 21.",
            math: `b = floor(${Y}/100) = ${b} | d = floor(${b}/4) = ${d} | e = ${b}%4 = ${e}`
        });

        // Step 3
        const f = Math.floor((b + 8) / 25);
        const g = Math.floor((b - f + 1) / 3);
        await printStep({
            title: "Step 3: The Lunar Equation (g)",
            why: "Because 19 solar years are slightly shorter than 235 lunar months, we must 'correct' the moon's position by one day 8 times every 2500 years.",
            math: `f = floor((${b}+8)/25) = ${f} | g = floor((${b}-${f}+1)/3) = <span class="highlight">${g}</span>`
        });

        // Step 4
        const h = (19 * a + b - d - g + 15) % 30;
        await printStep({
            title: "Step 4: Locating the Paschal Full Moon (h)",
            why: "The 'Epact' represents the age of the moon on March 21. It determines which day is the official 14th day of the lunar month (the Paschal Moon).",
            math: `h = (19*${a} + ${b} - ${d} - ${g} + 15) % 30 = <span class="highlight">${h}</span>`
        });

        // Step 5
        const i = Math.floor(c / 4);
        const k = c % 4;
        const l = (32 + 2 * e + 2 * i - h - k) % 7;
        await printStep({
            title: "Step 5: The Sunday Alignment (l)",
            why: "We need the first Sunday AFTER the full moon. This variable finds the weekday index of the Paschal Moon.",
            math: `l = (32 + 2*${e} + 2*floor(${c}/4) - ${h} - ${c}%4) % 7 = <span class="highlight">${l}</span>`
        });

        // Step 6 & 7
        const m = Math.floor((a + 11 * h + 22 * l) / 451);
        const month = Math.floor((h + l - 7 * m + 114) / 31);
        const day = ((h + l - 7 * m + 114) % 31) + 1;
        const easter = new Date(Y, month - 1, day);
        const ashMonday = new Date(easter);
        ashMonday.setDate(easter.getDate() - 48);

        await printStep({
            title: "Step 6: Easter Anchor Point",
            why: "Aggregating the solar and lunar data to find the Gregorian Easter Sunday.",
            math: `Result: ${easter.toDateString()}`
        });

        await printStep({
            title: "Step 7: Reverting to Ash Monday",
            why: "Counting back 48 days (6 weeks of Great Lent + Clean Week).",
            math: `Calculation: ${easter.toDateString()} - 48 Days = <span class="highlight">${ashMonday.toDateString()}</span>`
        });

        const out = document.getElementById('output');
        out.innerHTML += `<div class="final-result">LENT BEGINS (ASH MONDAY) ${Y}:<br>${ashMonday.toLocaleDateString(undefined, {weekday:'long', month:'long', day:'numeric', year:'numeric'})}</div>`;
    }
</script>

</body>
</html>
